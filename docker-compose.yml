services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: bibliotech-app
    volumes:
      - .:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=biblioteca_barrial
      - DB_USERNAME=biblioteca
      - DB_PASSWORD=secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bibliotech

  webserver:
    image: nginx:alpine
    container_name: bibliotech-nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - bibliotech

  db:
    image: mysql:8.0
    container_name: bibliotech-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=biblioteca_barrial
      - MYSQL_USER=biblioteca
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bibliotech

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: bibliotech-phpmyadmin
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - bibliotech

networks:
  bibliotech:

volumes:
  db_data:
