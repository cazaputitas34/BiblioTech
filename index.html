<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Central</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <!-- Tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container py-5 text-center">
      <i class="fa-solid fa-book-bookmark header-icon mb-3"></i>
      <h1 class="mb-1">Biblioteca Central</h1>
      <p class="header-sub mb-0">San José · Catálogo de libros</p>
    </div>
  </header>

  <main class="container my-5">

    <div class="row g-4">

      <!-- Agregar libro -->
      <div class="col-lg-5">
        <section class="card panel h-100">
          <div class="card-body p-4">
            <h2 class="panel-title"><i class="fa-solid fa-plus me-2"></i>Agregar un libro</h2>
            <form id="form-libro" class="mt-3" novalidate>
              <div class="mb-3">
                <label for="titulo" class="form-label">Título</label>
                <input type="text" id="titulo" class="form-control" placeholder="Ej: Cien años de soledad" required>
              </div>
              <div class="mb-3">
                <label for="autor" class="form-label">Autor</label>
                <input type="text" id="autor" class="form-control" placeholder="Ej: Gabriel García Márquez" required>
              </div>
              <div class="mb-4">
                <label for="categoria" class="form-label">Categoría</label>
                <select id="categoria" class="form-select">
                  <option value="Novela">Novela</option>
                  <option value="Ciencia ficción">Ciencia ficción</option>
                  <option value="Infantil">Infantil</option>
                  <option value="Poesía">Poesía</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>
              <button type="submit" class="btn btn-brand w-100">
                <i class="fa-solid fa-book-medical me-2"></i>Agregar libro
              </button>
            </form>
          </div>
        </section>
      </div>

      <!-- Listado -->
      <div class="col-lg-7">
        <section class="card panel h-100">
          <div class="card-body p-4">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h2 class="panel-title mb-0"><i class="fa-solid fa-layer-group me-2"></i>Libros disponibles</h2>
              <span id="contador-libros" class="badge contador"></span>
            </div>

            <div class="row g-2 mb-4">
              <div class="col-sm-7">
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass"></i></span>
                  <input type="text" id="buscar" class="form-control" placeholder="Buscar por título o autor…">
                </div>
              </div>
              <div class="col-sm-5">
                <select id="filtro-categoria" class="form-select">
                  <option value="Todas">Todas las categorías</option>
                  <option value="Novela">Novela</option>
                  <option value="Ciencia ficción">Ciencia ficción</option>
                  <option value="Infantil">Infantil</option>
                  <option value="Poesía">Poesía</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>
            </div>

            <ul class="list-unstyled lista-libros" id="lista-libros"></ul>

            <div id="estado-vacio" class="text-center text-muted py-5 d-none">
              <i class="fa-solid fa-book-open fa-2x mb-3"></i>
              <p class="mb-0">No hay libros que coincidan con la búsqueda.</p>
            </div>

          </div>
        </section>
      </div>

    </div>
  </main>

  <footer class="site-footer text-center py-4">
    <p class="mb-0">&copy; 2026 Biblioteca Central · San José</p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
